name: CI/CD

# CI runs the same gate a developer runs locally (`npm run verify`) so that a
# type error, lint error, failing test or broken production build can never
# reach `main` unnoticed. CD then promotes `main` to production on Vercel - but
# only after that gate has passed.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A newer push to the same branch makes the running job obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Vercel project identifiers. These are public - they appear in the project's
  # dashboard URL - so only VERCEL_TOKEN is stored as a secret.
  VERCEL_ORG_ID: team_Yd5upSgFFpOZQcqTlmP7bz9k
  VERCEL_PROJECT_ID: prj_47jdDtz3Oi5CpydlSGPtj6jDavSk

jobs:
  verify:
    name: Verify (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Next.js 16 requires Node >= 20.9.0.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel (production)
    # Production only: pull requests stop at `verify`, and pushes to `dev` are
    # never deployed. `needs` guarantees unverified code cannot ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require the VERCEL_TOKEN secret
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::error::Missing the VERCEL_TOKEN repository secret."
            echo "Create one at https://vercel.com/account/tokens, then add it under"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel builds the project on its own infrastructure from the committed
      # lockfile - the same way a deploy from the dashboard would.
      - name: Deploy to production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
